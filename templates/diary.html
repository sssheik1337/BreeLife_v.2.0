<!DOCTYPE html>
<html lang="ru" data-app-name="{{ APP_NAME }}">
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ APP_NAME }}</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
      body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-[#f8fafc] via-[#f0f9ff] to-[#f0fdf4]">
    <custom-layout>
        <custom-navbar></custom-navbar>

        <main class="flex-1 px-4 py-8">
            <div class="max-w-md mx-auto space-y-6">
                <div class="text-center">
                    <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-r from-emerald-400 to-cyan-400 mb-4 shadow-lg">
                        <i data-feather="book-open" class="w-7 h-7 text-white"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-slate-800">Дневник питания</h1>
                    <p class="text-slate-500 mt-2">Добавляйте продукты по приёмам пищи и редактируйте записи через кнопку «+».</p>
                </div>

                <div class="bg-white rounded-2xl p-4 shadow-lg border border-slate-100" id="diary-mode-day">
                    <div class="flex flex-wrap items-start justify-between gap-3">
                        <div>
                            <h3 class="font-semibold text-slate-800">Приёмы пищи по дате</h3>
                            <p class="text-sm text-slate-500">Выберите дату и добавляйте продукты в завтрак, обед, ужин или перекус.</p>
                        </div>
                        <input type="date" id="diary-day-date" class="form-input w-auto" required>
                    </div>
                    <p id="diary-day-hint" class="text-sm text-slate-500 mt-3"></p>
                </div>

                <div class="space-y-3" id="diary-meals">
                    <div class="bg-white rounded-2xl p-4 shadow-lg border border-slate-100">
                        <div class="flex items-center justify-between">
                            <span class="font-semibold text-slate-800">☀️ Завтрак</span>
                            <span id="diary-meal-breakfast-total" class="text-xs text-slate-500"></span>
                        </div>
                        <div id="diary-meal-breakfast-list" class="mt-3 space-y-2 text-sm text-slate-600"></div>
                    </div>
                    <div class="bg-white rounded-2xl p-4 shadow-lg border border-slate-100">
                        <div class="flex items-center justify-between">
                            <span class="font-semibold text-slate-800">🌤 Обед</span>
                            <span id="diary-meal-lunch-total" class="text-xs text-slate-500"></span>
                        </div>
                        <div id="diary-meal-lunch-list" class="mt-3 space-y-2 text-sm text-slate-600"></div>
                    </div>
                    <div class="bg-white rounded-2xl p-4 shadow-lg border border-slate-100">
                        <div class="flex items-center justify-between">
                            <span class="font-semibold text-slate-800">🌙 Ужин</span>
                            <span id="diary-meal-dinner-total" class="text-xs text-slate-500"></span>
                        </div>
                        <div id="diary-meal-dinner-list" class="mt-3 space-y-2 text-sm text-slate-600"></div>
                    </div>
                    <div class="bg-white rounded-2xl p-4 shadow-lg border border-slate-100">
                        <div class="flex items-center justify-between">
                            <span class="font-semibold text-slate-800">🌗 Перекус</span>
                            <span id="diary-meal-snack-total" class="text-xs text-slate-500"></span>
                        </div>
                        <div id="diary-meal-snack-list" class="mt-3 space-y-2 text-sm text-slate-600"></div>
                    </div>
                </div>

                <div id="diary-products-panel" class="diary-panel hidden">
                    <div class="diary-panel__card">
                        <div class="flex items-center justify-between">
                            <h3 class="font-semibold text-slate-800">Добавить приём пищи</h3>
                            <button type="button" id="diary-products-close" class="btn-secondary">Закрыть</button>
                        </div>
                        <form id="diary-products-form" class="space-y-4 mt-4">
                            <input type="date" id="diary-products-date" class="form-input" required>
                            <div id="diary-products-meta" class="hidden">
                                <input type="time" id="diary-products-sleep" class="form-input" placeholder="Сон, время отхода">
                                <input type="number" id="diary-products-water" class="form-input" placeholder="Вода, л" min="0" step="0.01">
                                <label class="flex items-center gap-2 text-sm text-slate-600">
                                    <input type="checkbox" class="form-checkbox" id="diary-products-activity">
                                    <span>Сегодня была активность</span>
                                </label>
                            </div>
                            <select id="diary-products-meal" class="form-input" required>
                                <option value="breakfast">Завтрак</option>
                                <option value="lunch">Обед</option>
                                <option value="dinner">Ужин</option>
                                <option value="snack">Перекус</option>
                                <option value="water">Вода</option>
                            </select>

                            <div id="diary-products-items" class="space-y-3"></div>

                            <button type="button" id="diary-add-item" class="btn-secondary w-full">
                                Добавить продукт
                            </button>
                            <button type="submit" class="btn-primary w-full">
                                Сохранить приём пищи
                            </button>
                            <button type="button" id="diary-products-delete" class="btn-secondary w-full hidden">
                                Удалить приём пищи
                            </button>
                        </form>
                    </div>
                </div>

            </div>
        </main>

        <div id="diary-fab-backdrop" class="diary-fab-backdrop hidden"></div>
        <div id="diary-fab-menu" class="diary-fab__menu hidden">
            <button type="button" class="diary-fab__item" data-fab-action="meal" data-meal="breakfast">➕ Добавить завтрак</button>
            <button type="button" class="diary-fab__item" data-fab-action="meal" data-meal="lunch">➕ Добавить обед</button>
            <button type="button" class="diary-fab__item" data-fab-action="meal" data-meal="dinner">➕ Добавить ужин</button>
            <button type="button" class="diary-fab__item" data-fab-action="meal" data-meal="snack">➕ Добавить перекус</button>
            <button type="button" class="diary-fab__item" data-fab-action="water">💧 Добавить воду</button>
        </div>

        <custom-footer></custom-footer>
    </custom-layout>

    <script src="/static/components/layout.js"></script>
    <script src="/static/components/navbar.js"></script>
    <script src="/static/components/footer.js"></script>
    <script src="/static/js/storage.js"></script>
    <script src="/static/js/ai_stub.js"></script>
    <script src="/static/js/ui.js"></script>
    <script>
        window.adminConfig = {{ admin_config | tojson }};
        window.aiEnabled = {{ ai_enabled | tojson }};
    </script>
    <script src="/static/js/diary.js"></script>
    <script>
        feather.replace();
    </script>
</body>
</html>

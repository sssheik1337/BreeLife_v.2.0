<!DOCTYPE html>
<html lang="ru">
  <head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Админка</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f8fafc;
        margin: 0;
        padding: 24px;
        color: #0f172a;
      }
      .card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 20px;
      }
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
      }
      .links {
        display: grid;
        gap: 12px;
      }
      a {
        color: #2563eb;
        text-decoration: none;
        font-weight: 600;
      }
      .message {
        margin-bottom: 12px;
        padding: 10px 12px;
        border-radius: 6px;
      }
      .message.error {
        background: #fee2e2;
        color: #b91c1c;
      }
      .message.success {
        background: #dcfce7;
        color: #166534;
      }
      .logout button {
        background: #0f172a;
        color: #ffffff;
        border: none;
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
      }
      @media (max-width: 768px) {
        body {
          padding: 14px;
        }
        .toolbar {
          flex-direction: column;
          align-items: flex-start;
          gap: 12px;
          margin-bottom: 16px;
        }
        .toolbar h1 {
          margin: 0 0 10px;
          font-size: 44px;
          line-height: 1;
        }
        .logout {
          width: 100%;
        }
        .logout button {
          width: 100%;
          min-height: 44px;
          font-size: 16px;
        }
        .card {
          padding: 14px;
        }
        .links {
          gap: 14px;
        }
        a {
          font-size: 20px;
          line-height: 1.3;
        }
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <div>
        <h1>Админка</h1>
        <div>Backoffice управления питанием</div>
      </div>
      <form class="logout" method="post" action="/admin/logout">
        <button type="submit">Выйти</button>
      </form>
    </div>

    {% if error %}
      <div class="message error">{{ error }}</div>
    {% endif %}
    {% if success %}
      <div class="message success">{{ success }}</div>
    {% endif %}

    <div class="card">
      <div class="links">
        <a href="/admin/products">Продукты</a>
        <a href="/admin/groups">Группы продуктов</a>
        <a href="/admin/norms">Нормы</a>
        <a href="/admin/plans">Тарифы</a>
      </div>
    </div>
  </body>
</html>

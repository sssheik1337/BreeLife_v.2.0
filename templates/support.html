<!DOCTYPE html>
<html lang="ru" data-app-name="{{ APP_NAME }}">
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ APP_NAME }}</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
      body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-[#f8fafc] via-[#f0f9ff] to-[#f0fdf4]">
    <custom-layout>
        <custom-navbar></custom-navbar>

        <main class="flex-1 px-4 py-8">
            <div class="max-w-md mx-auto space-y-8">
                <div class="text-center">
                    <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-r from-cyan-400 to-blue-500 mb-4 shadow-lg">
                        <i data-feather="life-buoy" class="w-7 h-7 text-white"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-slate-800">Помощь</h1>
                    <p class="text-slate-500 mt-2">Если нужна поддержка, воспользуйтесь удобным способом связи.</p>
                </div>

                <div class="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm space-y-3">
                    <a href="https://t.me" class="flex items-center justify-between rounded-xl border border-slate-100 bg-slate-50 px-4 py-3 hover:bg-slate-100 transition">
                        <div>
                            <p class="font-semibold text-slate-800">Поддержка в Telegram</p>
                            <p class="text-sm text-slate-500">Быстрый канал связи</p>
                        </div>
                        <i data-feather="external-link" class="w-5 h-5 text-slate-400"></i>
                    </a>
                    <div class="rounded-xl border border-slate-100 bg-slate-50 px-4 py-3">
                        <p class="font-semibold text-slate-800">Статус сервиса</p>
                        <p class="text-sm text-slate-500 mt-1">Если что-то не работает, напишите в поддержку и опишите шаги воспроизведения.</p>
                    </div>
                </div>
            </div>
        </main>

        <custom-footer></custom-footer>
    </custom-layout>

    <script src="/static/components/layout.js"></script>
    <script src="/static/components/navbar.js"></script>
    <script src="/static/components/footer.js"></script>
    <script src="/static/js/storage.js"></script>
    <script src="/static/js/ui.js"></script>
    <script>
        feather.replace();
    </script>
</body>
</html>

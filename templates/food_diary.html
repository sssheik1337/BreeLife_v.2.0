<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BreeLife</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
      body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-[#f8fafc] via-[#f0f9ff] to-[#f0fdf4]">
    <custom-layout>
        <custom-navbar></custom-navbar>

        <main class="flex-1 px-4 py-8">
            <div class="max-w-md mx-auto space-y-6">
                <div class="text-center">
                    <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-r from-emerald-400 to-cyan-400 mb-4 shadow-lg">
                        <i data-feather="list" class="w-7 h-7 text-white"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-slate-800">Дневник питания</h1>
                    <p class="text-slate-500 mt-2">Добавляйте продукты вручную без базы</p>
                </div>

                <div class="bg-white rounded-2xl p-6 shadow-lg border border-slate-100">
                    <h3 class="font-semibold text-slate-800 mb-4">Новая запись</h3>
                    <form id="food-diary-form" class="space-y-4">
                        <input type="date" id="food-diary-date" class="form-input" required>
                        <select id="food-diary-meal" class="form-input" required>
                            <option value="breakfast">Завтрак</option>
                            <option value="lunch">Обед</option>
                            <option value="dinner">Ужин</option>
                            <option value="snack">Перекус</option>
                        </select>

                        <div id="food-items" class="space-y-3"></div>

                        <button type="button" id="add-food-item" class="btn-secondary w-full">
                            Добавить продукт
                        </button>
                        <button type="submit" class="btn-primary w-full">
                            Сохранить запись
                        </button>
                    </form>
                </div>

                <div class="bg-white rounded-2xl p-6 shadow-lg border border-slate-100">
                    <h3 class="font-semibold text-slate-800 mb-4">Сводка за день</h3>
                    <div id="daily-summary" class="text-sm text-slate-600 space-y-2"></div>
                </div>

                <div class="bg-white rounded-2xl p-6 shadow-lg border border-slate-100">
                    <h3 class="font-semibold text-slate-800 mb-4">Контроль режима</h3>
                    <div class="flex items-center gap-3">
                        <span id="deviation-indicator" class="inline-flex h-3 w-3 rounded-full bg-emerald-400"></span>
                        <span id="deviation-text" class="text-sm text-slate-700"></span>
                    </div>
                </div>

                <div class="bg-white rounded-2xl p-6 shadow-lg border border-slate-100">
                    <h3 class="font-semibold text-slate-800 mb-4">Последние записи</h3>
                    <div id="food-diary-list" class="space-y-3 text-sm text-slate-600"></div>
                </div>
            </div>
        </main>

        <custom-footer></custom-footer>
    </custom-layout>

    <script src="/static/components/layout.js"></script>
    <script src="/static/components/navbar.js"></script>
    <script src="/static/components/footer.js"></script>
    <script src="/static/js/storage.js"></script>
    <script src="/static/js/ui.js"></script>
    <script>
        window.adminConfig = {{ admin_config | tojson }};
        window.aiEnabled = {{ ai_enabled | tojson }};
    </script>
    <script src="/static/js/food_diary.js"></script>
    <script>
        feather.replace();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
  <head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Админка — группы</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f8fafc;
        margin: 0;
        padding: 24px;
        color: #0f172a;
      }
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
      }
      .card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 20px;
      }
      input[type="text"] {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid #cbd5f5;
        border-radius: 6px;
        box-sizing: border-box;
      }
      button {
        padding: 6px 12px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      .btn-primary {
        background: #2563eb;
        color: #ffffff;
      }
      .btn-danger {
        background: #dc2626;
        color: #ffffff;
      }
      .message {
        margin-bottom: 12px;
        padding: 10px 12px;
        border-radius: 6px;
      }
      .message.error {
        background: #fee2e2;
        color: #b91c1c;
      }
      .message.success {
        background: #dcfce7;
        color: #166534;
      }
      .group-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .group-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
      }
      .toolbar-links a {
        margin-right: 12px;
        color: #2563eb;
        text-decoration: none;
        font-weight: 600;
      }
      .logout button {
        background: #0f172a;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <div>
        <h1>Группы продуктов</h1>
        <div class="toolbar-links">
          <a href="/admin">Главная</a>
          <a href="/admin/products">Продукты</a>
          <a href="/admin/norms">Нормы</a>
        </div>
      </div>
      <form class="logout" method="post" action="/admin/logout">
        <button type="submit">Выйти</button>
      </form>
    </div>

    {% if error %}
      <div class="message error">{{ error }}</div>
    {% endif %}
    {% if success %}
      <div class="message success">{{ success }}</div>
    {% endif %}

    <div class="card">
      <h2>Добавить группу</h2>
      <form method="post" action="/admin/groups/add">
        <label>
          Название группы
          <input type="text" name="name" required />
        </label>
        <div style="margin-top: 12px;">
          <button class="btn-primary" type="submit">Добавить</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h2>Список групп</h2>
      <div class="group-list">
        {% for group in groups %}
          <div class="group-item">
            <div>{{ group }}</div>
            <form method="post" action="/admin/groups/delete">
              <input type="hidden" name="name" value="{{ group }}" />
              <button class="btn-danger" type="submit">Удалить</button>
            </form>
          </div>
        {% endfor %}
      </div>
    </div>
  </body>
</html>

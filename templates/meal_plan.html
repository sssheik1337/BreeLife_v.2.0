<!DOCTYPE html>
<html lang="ru" data-app-name="{{ APP_NAME }}">
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{ APP_NAME }}</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-[#f8fafc] via-[#f0f9ff] to-[#f0fdf4]">
    <custom-layout>
        <custom-navbar></custom-navbar>

        <main class="flex-1 px-4 py-8">
            <div class="max-w-md mx-auto space-y-8">
                <div class="text-center">
                    <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-r from-emerald-400 to-cyan-400 mb-4 shadow-lg">
                        <i data-feather="book-open" class="w-7 h-7 text-white"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-slate-800">Рацион питания</h1>
                    <p class="text-slate-500 mt-2">План собран под ваш ритм, цели и любимые продукты.</p>
                </div>

                <div class="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm space-y-3">
                    <div class="flex items-start justify-between gap-3">
                        <div>
                            <p class="text-sm text-slate-500">Диапазон</p>
                            <p id="meal-plan-desc" class="text-sm text-slate-500">Без медицинских обещаний.</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button type="button" class="text-xs font-semibold px-3 py-1 rounded-full bg-emerald-100 text-emerald-700" data-plan-range="day">День</button>
                            <button type="button" class="text-xs font-semibold px-3 py-1 rounded-full bg-slate-100 text-slate-500" data-plan-range="week">Неделя</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-3 gap-4 text-center">
                        <div>
                            <p class="text-xs text-slate-500">Калории</p>
                            <p id="meal-plan-calories" class="text-base font-semibold text-slate-800">—</p>
                        </div>
                        <div>
                            <p class="text-xs text-slate-500">Белки/жиры/углеводы</p>
                            <p id="meal-plan-macros" class="text-base font-semibold text-slate-800">—</p>
                        </div>
                        <div>
                            <p class="text-xs text-slate-500">Продукты</p>
                            <p id="meal-plan-products" class="text-base font-semibold text-slate-800">—</p>
                        </div>
                    </div>
                </div>

                <div id="meal-plan-container" class="space-y-6">
                    <p class="text-center text-slate-400">Загрузка...</p>
                </div>
            </div>
        </main>

        <custom-footer></custom-footer>
    </custom-layout>

    <script src="/static/components/layout.js"></script>
    <script src="/static/components/navbar.js"></script>
    <script src="/static/components/footer.js"></script>
    <script src="/static/js/storage.js"></script>
    <script src="/static/js/calculations.js"></script>
    <script src="/static/js/ui.js?v={{ static_mtime('js/ui.js') }}"></script>
    <script src="/static/js/meal_plan.js"></script>
    <script>
        feather.replace();
    </script>
</body>
</html>
